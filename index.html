<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>SKYHOOK Mobile</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#09131f;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 3px #000}#info{font-size:12px;opacity:.8}#controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}.pad{width:118px;height:118px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;left:39px;top:39px;width:38px;height:38px;background:#b9e5ff88;border-radius:50%}.buttons{display:grid;grid-template-columns:repeat(3,62px);gap:8px;pointer-events:auto}.buttons button{height:60px;border-radius:16px;border:1px solid #ffffff66;background:#193c59d9;color:white;font-weight:800;font-size:12px;touch-action:none}.buttons button:active,.buttons button.active{background:#48a9db}.buttons .attack{background:#b74840d9}#intro{position:absolute;inset:0;background:#07111de8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:5}#intro h1{font-size:34px;letter-spacing:4px;margin:0 0 12px}#intro p{line-height:1.7;max-width:420px}#start{font-size:20px;padding:13px 36px;border:0;border-radius:12px;background:#4cc1f0;color:#061523;font-weight:800}#msg{position:absolute;top:25%;left:0;right:0;text-align:center;font-size:24px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}#cross{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#c9ecff99;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div>SKYHOOK <span id="score">討伐 0 / 5</span><div id="info">HP <span id="hp">100</span>　GAS <span id="gas">100</span></div></div><div id="speed">0 km/h</div></div><div id="cross">+</div><div id="msg"></div><div id="controls"><div id="pad" class="pad"><div id="nub" class="nub"></div></div><div class="buttons"><button id="left">左ワイヤー</button><button id="boost">加速</button><button id="right">右ワイヤー</button><button id="turnL">↶ 回転</button><button id="attack" class="attack">斬撃</button><button id="turnR">回転 ↷</button></div></div><div id="intro"><h1>SKYHOOK</h1><p>iPhoneで遊べる立体機動アクション試作版。<br>左のパッドで移動、左右ワイヤーで建物へ牽引、加速で飛行。敵の背後に回り、近づいて斬撃しよう。</p><button id="start">ゲーム開始</button><p style="font-size:12px;opacity:.7">横画面推奨・通信不要・オリジナル試作品</p></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:4,z:-28,vx:0,vy:0,vz:0,yaw:0,hp:100,gas:100};let score=0,running=false,won=false,last=0,flash=0;const keys={};const buildings=[];for(let ix=-4;ix<=4;ix++)for(let iz=-4;iz<=4;iz++){if(Math.abs(ix)<=1&&Math.abs(iz)<=1)continue;let x=ix*24,z=iz*24;buildings.push({x,z,w:13,h:15+((ix*19+iz*11+200)%24),d:13})}let enemies=[{x:0,z:22},{x:28,z:4},{x:-25,z:8},{x:22,z:42},{x:-28,z:45}].map((e,i)=>({...e,h:13,alive:true,phase:i*2,face:Math.PI}));const hooks={left:null,right:null};
function proj(x,y,z){let dx=x-player.x,dy=y-player.y,dz=z-player.z,co=Math.cos(player.yaw),si=Math.sin(player.yaw),rx=dx*co-dz*si,rz=dx*si+dz*co;if(rz<.3)return null;let f=Math.min(W,H)*.92;return {x:W/2+rx*f/rz,y:H*.49-dy*f/rz,z:rz}}function line3(a,b,color,width=1){let p=proj(...a),q=proj(...b);if(!p||!q)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}function poly3(points,fill,stroke){let ps=points.map(p=>proj(...p));if(ps.some(p=>!p))return;ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function box(b){let x=b.x,z=b.z,w=b.w/2,d=b.d/2,h=b.h;let p=[[x-w,0,z-d],[x+w,0,z-d],[x+w,h,z-d],[x-w,h,z-d],[x-w,0,z+d],[x+w,0,z+d],[x+w,h,z+d],[x-w,h,z+d]];poly3([p[3],p[2],p[6],p[7]],'#4b6a80','#91b0c0');poly3([p[2],p[1],p[5],p[6]],'#314b60','#91b0c0');poly3([p[3],p[7],p[4],p[0]],'#253c50','#91b0c0');poly3([p[3],p[2],p[1],p[0]],'#38586b','#91b0c0');poly3([p[7],p[6],p[5],p[4]],'#3a5268','#91b0c0');for(let yy=5;yy<h-2;yy+=5)for(let xx=-w+3;xx<w-1;xx+=4){line3([x+xx,yy,z-d-.03],[x+xx+1.5,yy,z-d-.03],'#e2c77b',2)}}
function titan(e,t){if(!e.alive)return;let bob=Math.sin(t*1.8+e.phase)*.2;const x=e.x,z=e.z,y=bob;line3([x-1.7,y+7,z],[x-2.2,y,z],'#d98d74',9);line3([x+1.7,y+7,z],[x+2.2,y,z],'#d98d74',9);line3([x-2.5,y+11,z],[x-4,y+6,z],'#d98d74',7);line3([x+2.5,y+11,z],[x+4,y+6,z],'#d98d74',7);line3([x,y+7,z],[x,y+12,z],'#b75f53',22);let head=proj(x,y+14,z);if(head){let r=Math.max(3,Math.min(80,1.6*Math.min(W,H)*.92/head.z));ctx.fillStyle='#e6ad8e';ctx.beginPath();ctx.ellipse(head.x,head.y,r*.7,r,0,0,7);ctx.fill();ctx.fillStyle='#291e20';ctx.fillRect(head.x-r*.4,head.y-r*.1,r*.23,r*.12);ctx.fillRect(head.x+r*.18,head.y-r*.1,r*.23,r*.12)}let weak=proj(x,y+12.8,z-1.5);if(weak){ctx.strokeStyle='#ff4c58';ctx.lineWidth=3;ctx.beginPath();ctx.arc(weak.x,weak.y,Math.max(4,170/weak.z),0,7);ctx.stroke()}}
function nearestAnchor(side){let dir=player.yaw+(side==='left'?-0.45:0.45),best=null,bd=1e9;for(let b of buildings){let dx=b.x-player.x,dz=b.z-player.z,dist=Math.hypot(dx,dz),angle=Math.atan2(dx,dz)-dir;angle=Math.atan2(Math.sin(angle),Math.cos(angle));if(dist<72&&dist>5&&Math.abs(angle)<.95&&dist<bd){bd=dist;best={x:b.x,y:Math.min(b.h-1,Math.max(9,player.y+8)),z:b.z}}}return best}
function hook(side){if(hooks[side]){hooks[side]=null;return}let a=nearestAnchor(side);if(a)hooks[side]=a;else notify('射程内に建物がない')}
function notify(s){let el=document.getElementById('msg');el.textContent=s;flash=1.2}
function attack(){let hit=false;for(let e of enemies){if(!e.alive)continue;let d=Math.hypot(e.x-player.x,e.z-player.z),dy=Math.abs(player.y-12.5);let behind=player.z<e.z-0.6;if(d<9&&dy<7&&behind){e.alive=false;score++;hit=true;document.getElementById('score').textContent=`討伐 ${score} / 5`;notify('討伐成功！');player.gas=Math.min(100,player.gas+15);break}}if(!hit)notify('背後から首の高さで斬撃！');if(score===5){won=true;notify('全巨人討伐！ ミッションクリア')}}
function update(dt,t){if(won)return;let mx=stick.x,my=stick.y,co=Math.cos(player.yaw),si=Math.sin(player.yaw);player.yaw+=(keys.turnL?-.025:0)+(keys.turnR?.025:0);let accel=22;player.vx+=(co*mx+si*(-my))*accel*dt;player.vz+=(-si*mx+co*(-my))*accel*dt;player.vy-=17*dt;for(let side of ['left','right']){let a=hooks[side];if(!a)continue;let dx=a.x-player.x,dy=a.y-player.y,dz=a.z-player.z,dist=Math.hypot(dx,dy,dz);let force=35+(keys.boost&&player.gas>0?30:0);player.vx+=dx/dist*force*dt;player.vy+=dy/dist*force*dt;player.vz+=dz/dist*force*dt;if(dist<5)hooks[side]=null}if(keys.boost&&player.gas>0){player.vx+=si*36*dt;player.vz+=co*36*dt;player.vy+=9*dt;player.gas=Math.max(0,player.gas-20*dt)}else player.gas=Math.min(100,player.gas+4*dt);let drag=Math.exp(-.55*dt);player.vx*=drag;player.vy*=Math.exp(-.18*dt);player.vz*=drag;let speed=Math.hypot(player.vx,player.vy,player.vz),max=52;if(speed>max){player.vx*=max/speed;player.vy*=max/speed;player.vz*=max/speed}player.x+=player.vx*dt;player.y+=player.vy*dt;player.z+=player.vz*dt;if(player.y<2){player.y=2;player.vy=Math.max(0,player.vy);player.vx*=.93;player.vz*=.93}player.x=Math.max(-110,Math.min(110,player.x));player.z=Math.max(-110,Math.min(110,player.z));for(let e of enemies){if(!e.alive)continue;let dx=player.x-e.x,dz=player.z-e.z,dist=Math.hypot(dx,dz);if(dist>3&&dist<55){e.x+=dx/dist*dt*1.3;e.z+=dz/dist*dt*1.3}if(dist<5&&player.y<12&&Math.sin(t*2+e.phase)>.97){player.hp=Math.max(0,player.hp-12);if(player.hp===0){notify('ゲームオーバー');won=true}}}document.getElementById('hp').textContent=Math.round(player.hp);document.getElementById('gas').textContent=Math.round(player.gas);document.getElementById('speed').textContent=Math.round(speed*3.6)+' km/h'}
function draw(t){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#12263e');sky.addColorStop(.65,'#688ba1');sky.addColorStop(1,'#a5a59b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);poly3([[-500,0,-500],[500,0,-500],[500,0,500],[-500,0,500]],'#465c59');for(let i=-100;i<=100;i+=20){line3([i,.04,-110],[i,.04,110],'#78908966');line3([-110,.04,i],[110,.04,i],'#78908966')}let objects=[...buildings.map(b=>({d:Math.hypot(b.x-player.x,b.z-player.z),f:()=>box(b)})),...enemies.filter(e=>e.alive).map(e=>({d:Math.hypot(e.x-player.x,e.z-player.z),f:()=>titan(e,t)}))];objects.sort((a,b)=>b.d-a.d).forEach(o=>o.f());for(let side of ['left','right']){let a=hooks[side];if(a)line3([player.x,player.y,player.z], [a.x,a.y,a.z],side==='left'?'#8bdfff':'#ffe09b',3)}ctx.fillStyle='#ffffffaa';ctx.fillRect(W/2-1,H*.49-1,2,2);if(flash>0){document.getElementById('msg').style.opacity=Math.min(1,flash);flash-=.016}else document.getElementById('msg').style.opacity=0}
function frame(ms){let t=ms/1000,dt=Math.min(.035,t-(last||t));last=t;if(running){update(dt,t);draw(t)}requestAnimationFrame(frame)}requestAnimationFrame(frame);let stick={x:0,y:0};const pad=document.getElementById('pad'),nub=document.getElementById('nub');function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.max(1,Math.hypot(x,y)),m=Math.min(42,d);stick.x=x/d*m/42;stick.y=y/d*m/42;nub.style.transform=`translate(${stick.x*39}px,${stick.y*39}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)padMove(e)});function resetPad(){stick.x=stick.y=0;nub.style.transform=''}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);for(let id of ['boost','turnL','turnR']){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[id]=true;el.classList.add('active');el.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel'])el.addEventListener(event,()=>{keys[id]=false;el.classList.remove('active')})}for(let side of ['left','right'])document.getElementById(side).addEventListener('pointerdown',e=>{e.preventDefault();hook(side)});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';running=true};document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script></body></html>
